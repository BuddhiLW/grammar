name: release

# Patch-bump and publish to Clojars only when the push changes the library.
# README / CI-only commits do not mint a version, because a published pom is
# immutable. Derived from the hive-olympus release workflow; grammar adds
# busybox (the suite runs real interpreters) and a strict licence gate.
#
# Secrets: CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'VERSION'
      - 'version.edn'
      - 'LICENSE'
      # The suite gates the bump/deploy below, so a test-only change must be
      # able to trigger a run.
      - 'test/**'
      # A change to the release pipeline is exercised by the push that makes it.
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      # The suite drives real bash, bash -r, dash, busybox sh and python3.
      - name: Interpreters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
          for b in /usr/bin/bash /usr/bin/dash /usr/bin/busybox; do test -x "$b"; done
          python3 --version

      # Gate BEFORE the bump: a published pom is immutable, so a red suite must
      # not be able to mint a version, tag it and ship it.
      - name: Test
        run: clojure -M:test

      - name: Licence agreement (LICENSE, version.edn, SPDX headers)
        run: clojure -T:build verify-license :strict true

      # The release number comes from the tags, not from a commit back to main.
      # VERSION in the tree is a FLOOR; this run releases patch+1 of
      # max(VERSION, newest v* tag, newest release on Clojars). Clojars is
      # consulted because a published pom is immutable: if a run deployed but
      # died before pushing its tag, the next run must not mint that version
      # again. Only a 404 (never published) counts as no version; any other
      # answer stops the run rather than guess a base that may be too low.
      - name: Resolve release base from tags and Clojars
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          CODE=$(curl -sS --max-time 20 --retry 3 -o "$RUNNER_TEMP/clojars.json" \
            -w '%{http_code}' \
            https://clojars.org/api/artifacts/io.github.buddhilw/grammar || true)
          case "$CODE" in
            200) PUBLISHED=$(jq -er '.latest_release' "$RUNNER_TEMP/clojars.json") ;;
            404) PUBLISHED= ;;
            *)   echo "Clojars API answered '${CODE:-nothing}'; refusing to guess the release base" >&2
                 exit 1 ;;
          esac
          BASE=$(printf '%s\n%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" "${PUBLISHED:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}, on Clojars ${PUBLISHED:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Regenerate changelog
        run: clojure -T:build changelog

      # Deploy BEFORE tagging. A tag is the record that a version shipped; a
      # tag pushed ahead of a failed deploy is an orphan that makes the next
      # run skip a version number.
      - name: Deploy
        env:
          # deps-deploy and hive-build read CLOJARS_PASSWORD; the secret holds a
          # Clojars deploy token (the account password is refused).
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      # deploy is a no-op for a coordinate the registry already holds, and a
      # green step is not proof of an upload: assert the effect before the tag
      # claims it.
      - name: Verify published
        run: clojure -T:build verify-published

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          # deploy builds the jar only when it uploads. No jar means the
          # coordinate was already on Clojars from another commit, so this
          # commit must not take the tag.
          test -f "target/grammar-$VER.jar" || {
            echo "deploy uploaded nothing: $VER is already on Clojars; no tag" >&2
            exit 1
          }
          git config user.name  "grammar-ci"
          git config user.email "ci@users.noreply.github.com"
          # Tag only, no commit back to main. Annotated, so the next run's tag
          # scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      # The GitHub release carries this version's CHANGELOG.md section (the
      # file is regenerated above and never committed) and the deployed jar.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          awk -v head="## [$VER]" '
            index($0, "## [") == 1 { if (on) exit; on = (index($0, head) == 1); next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $VER." > release-notes.md
          cat release-notes.md
          gh release create "v$VER" --verify-tag --title "v$VER" \
            --notes-file release-notes.md target/grammar-"$VER".jar
